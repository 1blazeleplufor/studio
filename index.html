<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2c2c2f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>
Studio</title><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1b1b1d;--panel:#262628;--panel2:#2f2f32;--line:#111113;--line2:#3a3a3e;--txt:#e4e4e6;--dim:#9a9aa0;--acc:#4fa3ff;--rec:#ff3b30;--yel:#ffd60a;--grn:#30d158;--hdr:276px;--insp:236px}
html,body{height:100%;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--txt);font:12px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;user-select:none}
button,select,input{font:inherit;color:var(--txt)}
button{background:linear-gradient(#3c3c40,#323236);border:1px solid #151517;border-radius:5px;padding:3px 8px;cursor:pointer}
button:hover{background:linear-gradient(#46464b,#3a3a3f)}
button.on{background:linear-gradient(#2b6fd6,#1f5bb8);border-color:#0d3a7a}
button.recon{background:linear-gradient(#e0362c,#b8231b)}
select,input[type=text],input[type=number]{background:#161618;border:1px solid #444;border-radius:4px;padding:2px 4px}
#app{display:grid;grid-template-rows:52px 1fr auto;grid-template-columns:100%;height:100vh;height:100dvh;width:100vw;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#app>*{min-width:0}
#bar{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#bar>*{flex:none}
#bar .sp{flex:1 1 0}
/* control bar */
#bar{display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#3a3a3e,#2c2c2f);border-bottom:1px solid #000}
#bar .grp{display:flex;gap:4px;align-items:center}
#bar .sp{flex:1}
.tbtn{width:34px;height:28px;padding:0;font-size:15px;display:flex;align-items:center;justify-content:center}
#lcd{display:flex;gap:14px;align-items:center;background:#0f1a24;border:1px solid #000;border-radius:7px;padding:3px 14px;height:40px;box-shadow:inset 0 1px 6px #000}
#lcd .cell{display:flex;flex-direction:column;align-items:center;line-height:1.1}
#lcd .v{font:600 17px ui-monospace,Menlo,Consolas,monospace;color:#cfe8ff}
#lcd .l{font-size:9px;color:#6d8aa3;text-transform:uppercase;letter-spacing:.5px}
#lcd input,#lcd select{background:transparent;border:none;color:#cfe8ff;font:600 15px ui-monospace,Menlo,monospace;width:52px;text-align:center}
#lcd select{width:auto}
#lcd select option{background:#0f1a24}
/* main */
#main{display:grid;grid-template-columns:var(--insp) 1fr;min-height:0}
#main.noinsp{grid-template-columns:0 1fr}
#insp{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
#insp h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;padding:8px 10px 4px;border-top:1px solid var(--line2)}
#insp .sec{padding:4px 10px 8px}
.strips{display:flex;gap:6px;padding:8px}
.strip{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;align-items:stretch}
.strip .nm{text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px;border-radius:3px}
.slot{height:20px;border-radius:3px;background:#1a1a1c;border:1px solid #3d3d42;font-size:11px;padding:0 4px;display:flex;align-items:center;gap:3px;cursor:pointer;overflow:hidden;white-space:nowrap}
.slot.full{background:linear-gradient(#3f6fb0,#2f5a95);border-color:#1d3d68}
.slot.byp{opacity:.45}
.slot .pw{width:10px;height:10px;border-radius:50%;border:1px solid #000;background:#8fd;flex:none}
.slot.byp .pw{background:#555}
.slot .x{margin-left:auto;opacity:.6}
.slot.empty{color:#666;justify-content:center}
.fadwrap{display:flex;gap:4px;justify-content:center;height:150px;margin-top:4px}
.fader{writing-mode:vertical-lr;direction:rtl;width:22px;height:150px;accent-color:#bbb}
.meter{width:10px;height:150px;background:#0c0c0d;border:1px solid #000;border-radius:2px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,#30d158 0,#30d158 65%,#ffd60a 85%,#ff3b30 100%);background-size:100% 150px;background-position:bottom}
.db{text-align:center;font:11px ui-monospace,monospace;color:var(--dim)}
.msrow{display:flex;gap:3px;justify-content:center}
.msrow button{padding:1px 6px;font-size:11px;font-weight:700}
.btnM.on{background:#2f7bdc}.btnS.on{background:#d7b500;color:#000}.btnR.on{background:var(--rec)}.btnI.on{background:#e98a00}
/* tracks */
#arr{display:grid;grid-template-rows:28px 1fr;min-width:0;min-height:0}
#arrtop{display:grid;grid-template-columns:var(--hdr) 1fr;background:var(--panel);border-bottom:1px solid var(--line)}
#arrtools{display:flex;gap:3px;align-items:center;padding:0 5px;border-right:1px solid var(--line)}
#arrtools button{padding:2px 6px;font-size:11px}
#ruler{position:relative;overflow:hidden;cursor:pointer;background:#2b2b2e}
#ruler canvas{position:absolute;left:0;top:0}
#arrbody{display:grid;grid-template-columns:var(--hdr) 1fr;min-height:0}
#heads{overflow:hidden;background:var(--panel);border-right:1px solid var(--line)}
#lanesWrap{overflow:auto;position:relative;background:#1f1f21}
#lanes{position:relative}
.head{height:var(--th,84px);overflow:hidden;border-bottom:1px solid var(--line);display:flex;gap:6px;padding:6px;align-items:flex-start;cursor:pointer;position:relative}
.head.sel{background:#3a3a40}
.head .col{width:5px;align-self:stretch;border-radius:2px;flex:none}
.head .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.head .tname{background:transparent;border:1px solid transparent;width:100%;font-weight:600;padding:1px 3px}
.head .tname:focus{border-color:#555;background:#111}
.head .ico{font-size:16px;opacity:.8}
.head input[type=range]{width:100%;height:12px;accent-color:#aaa}
.lane{height:var(--th,84px);border-bottom:1px solid #18181a;position:relative}
.lane.sel{background:rgba(255,255,255,.03)}
.reg{position:absolute;top:2px;bottom:2px;border-radius:4px;overflow:hidden;cursor:grab;border:1px solid rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.reg.sel{box-shadow:inset 0 0 0 2px #fff}
.reg .rt{position:absolute;top:0;left:0;right:0;height:14px;font-size:10px;padding:1px 4px;background:rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;pointer-events:none}
.reg canvas{position:absolute;left:0;top:14px;pointer-events:none}
.reg .eh{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.reg .eh.l{left:0}.reg .eh.r{right:0}
#playhead{position:absolute;top:0;width:11px;margin-left:-5px;background:transparent;z-index:5;cursor:ew-resize;touch-action:none}
#playhead::after{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:#fff;box-shadow:0 0 3px #fff;pointer-events:none}
#cycleShade{position:absolute;top:0;background:rgba(255,214,10,.06);pointer-events:none;border-left:1px solid rgba(255,214,10,.4);border-right:1px solid rgba(255,214,10,.4)}
.grid{position:absolute;inset:0;pointer-events:none}
/* bottom */
#bottom{background:var(--panel);border-top:1px solid #000;display:flex;flex-direction:column;height:0;overflow:hidden}
#bottom.open{height:var(--bh,290px)}
#btabs{display:flex;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line);align-items:center}
#btabs .sp{flex:1}
#bcontent{flex:1;min-height:0;overflow:auto;position:relative}
#resizer{height:5px;cursor:ns-resize;background:#111}
/* mixer */
#mixer{display:flex;gap:4px;padding:8px;min-height:100%;align-items:flex-start;width:max-content}
.strip>*{flex:none}
#mixer .strip{width:92px;flex:none}
#mixer .strip.master{background:#34343a}
/* step seq */
#seq{padding:8px}
.seqrow{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.seqrow .rn{width:86px;font-weight:600;font-size:11px;cursor:pointer}
.seqrow .rn:hover{color:var(--acc)}
.step{width:26px;height:24px;border-radius:3px;background:#3a3a3e;border:1px solid #111;cursor:pointer;position:relative;flex:none}
.step.q{margin-left:6px}
.step.on{background:var(--c,#ff9f0a)}
.step.cur{outline:2px solid #fff}
.step b{position:absolute;inset:auto 0 1px 0;text-align:center;font-size:9px;color:#000;font-weight:800}
.seqrow input[type=range]{width:60px}
.seqctl{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
/* piano roll */
#proll{display:flex;height:100%}
#prKeysWrap{width:52px;flex:none;overflow:hidden;position:relative;background:#222}
#prScroll{flex:1;overflow:auto;position:relative}
#prCanvas{display:block}
/* knobs */
.knob{display:flex;flex-direction:column;align-items:center;gap:2px;width:62px}
.knob canvas{cursor:ns-resize}
.knob .kl{font-size:10px;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;width:100%;text-overflow:ellipsis}
.knob .kv{font:10px ui-monospace,monospace;color:#cfe8ff}
.knob.learn canvas{outline:2px dashed var(--yel);border-radius:50%}
.knob.mapped .kl::after{content:" ●";color:var(--yel)}
/* plugin window */
.pwin{position:fixed;z-index:50;background:linear-gradient(#3b3b40,#2a2a2e);border:1px solid #000;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.7);min-width:280px}
.pwin .pt{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:move;border-bottom:1px solid #000;background:linear-gradient(#4a4a50,#38383d);border-radius:10px 10px 0 0}
.pwin .pt b{flex:1}
.pwin .pb{padding:10px}
.pwin .knobs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pwin .row{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0;flex-wrap:wrap}
.pwin canvas.disp{background:#0e141a;border:1px solid #000;border-radius:6px;display:block;margin:0 auto 8px}
/* menus/modals */
.menu{position:fixed;z-index:100;background:#2d2d31;border:1px solid #000;border-radius:7px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.6);min-width:200px;max-height:70vh;overflow:auto}
.menu div{padding:5px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
.menu div:hover{background:#2b6fd6}
.menu .sep{height:1px;background:#444;margin:4px 0;padding:0;pointer-events:none}
.menu .hd{color:var(--dim);font-size:10px;text-transform:uppercase;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center}
.modal .box{background:#2a2a2e;border:1px solid #000;border-radius:10px;padding:18px;max-width:640px;max-height:85vh;overflow:auto;line-height:1.55}
.modal h2{margin-bottom:8px}.modal h4{margin:10px 0 4px;color:var(--acc)}
.modal kbd{background:#111;border:1px solid #555;border-radius:3px;padding:0 4px;font-size:11px}
.modal ul{padding-left:18px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:8px;z-index:300;display:none}
.lib{display:flex;flex-direction:column;gap:2px}
.lib div{padding:4px 6px;border-radius:4px;cursor:pointer;background:#1e1e20}
.lib div:hover{background:#2b6fd6}
.kv2{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:3px 0}
#drop{position:fixed;inset:0;border:3px dashed var(--acc);background:rgba(79,163,255,.08);z-index:150;display:none;align-items:center;justify-content:center;font-size:22px;pointer-events:none}
#bar button{white-space:nowrap}
#lcd{gap:10px;padding:3px 10px;white-space:nowrap}
#lcd .cell{white-space:nowrap}
#lcd select{font-size:13px}
#bar .sp{min-width:0}
@media (max-width:1400px){#lcd .cell.tm{display:none}#bTyping,#bMidi,#bFile{padding:3px 6px}}

.reg,.knob canvas,#ruler,.step,.pt,#resizer,.fader{touch-action:none}
#lanesWrap,#prScroll,#bcontent,#insp{touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.modal .box{max-width:min(640px,92vw)}
.prmode{display:none}
@media (pointer:coarse){
 button{min-height:30px}.tbtn{width:40px;height:34px}
 .msrow button{min-width:28px;min-height:26px}.slot{height:28px}.step{width:30px;height:30px}
 .reg .eh{width:16px}.prmode{display:inline-block}
 #arrtools button,#arrtools select{min-height:26px}
}
@media (max-width:900px){
 :root{--hdr:128px}
 #bar{overflow-x:auto;overflow-y:hidden;gap:6px;padding:0 6px}
 #bar>*{flex:none}#bar .sp{display:none}
 #lcd{gap:8px;padding:2px 8px}#lcd .cell.tm,#lcd .cell.sg{display:none}
 #main,#main.noinsp{grid-template-columns:1fr}
 #insp{position:fixed;left:0;top:52px;bottom:0;width:280px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:6px 0 24px rgba(0,0,0,.6)}
 #main.showinsp #insp{transform:none}
 .head{gap:4px;padding:5px 4px}.head .ico{display:none}
 .pwin{left:0!important;right:0;top:auto!important;bottom:0;border-radius:12px 12px 0 0;max-height:78dvh;overflow:auto;min-width:0}
 .pwin .pt{cursor:default}
 #bottom.open{height:min(var(--bh,330px),58dvh)}
 #btabs button{padding:3px 6px}
 .seqctl span{display:none}
}

.quick .qrow,.tools .qrow{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:4px;margin:3px 0}
.qn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qv{font:10px ui-monospace,monospace;color:#cfe8ff;text-align:right}
.quick input[type=range],.tools input[type=range]{width:100%;accent-color:#4fa3ff}
.quick select{width:100%}
.tools{display:flex;flex-direction:column;gap:4px}.tools>button{text-align:left}
@media (pointer:coarse){.quick .qrow,.tools .qrow{margin:7px 0}}

#marquee{position:absolute;border:1px solid #4fa3ff;background:rgba(79,163,255,.12);pointer-events:none;z-index:6}
#arrtools{overflow-x:auto;scrollbar-width:none}#arrtools>*{flex:none}
#arrtools{gap:2px}#arrtools button{padding:2px 5px}#arrtools select{width:58px}
#insp h3.fold{cursor:pointer;display:flex;align-items:center;gap:2px}#insp h3.fold:hover{color:#fff}#insp h3 .arr{display:inline-block;width:12px;color:#8ab4ff}
.reg .tiles{position:absolute;left:0;right:0;top:14px;bottom:0;pointer-events:none;overflow:hidden}.reg .tiles canvas{position:absolute;top:0}
#mixer .fadwrap,#mixer .fader,#mixer .meter{height:112px}#mixer .meter i{background-size:100% 112px}#mixer .strip{gap:3px;padding:5px}#mixer .slot{height:18px}
.colrow{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.swatch{width:16px;height:12px;min-height:0!important;padding:0;border-radius:3px;border:1px solid rgba(0,0,0,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);cursor:pointer}
.swatch.big{width:28px;height:22px;border-radius:5px}.swatch.cur{outline:2px solid #fff;outline-offset:1px}.swatch:hover{filter:brightness(1.15)}
/* v3.0 : session à plusieurs, cadenas */
#collabBar .avs{display:flex;align-items:center;cursor:pointer;padding:0 2px}
#collabBar .av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid #2c2c2f;margin-left:-6px;text-shadow:0 1px 1px rgba(0,0,0,.4)}
#collabBar .av:first-child{margin-left:0}
#collabBar .lkproj{font-size:13px}
.chip{padding:2px 8px;border-radius:10px;color:#fff;font-size:12px;font-weight:600}
.lkb{position:absolute;top:3px;right:3px;z-index:4;font-size:10px;line-height:1;min-height:0;height:auto;padding:2px 4px;border-radius:9px;background:#2a2a2e;border:1px solid #48484e;color:#ccc;opacity:.5;cursor:pointer;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.lkb:hover{opacity:1}
.lkb.me,.lkb.other{opacity:1;background:var(--lkc,#666);border-color:transparent;color:#fff;font-weight:700}
.head[data-lk] .info{padding-right:20px}
.strip{position:relative}.strip>.lkb{top:2px;right:2px;font-size:9px}
.head.lk-other,.strip.lk-other{box-shadow:inset 3px 0 0 var(--lkc)}
.head.lk-me,.strip.lk-me{box-shadow:inset 3px 0 0 var(--lkc)}
.head.lk-other .info,.strip.lk-other>:not(.lkb),.pwin.lk-other .pb,#bcontent.lk-other>*,#insp.lk-other>*,.cell.lk-other{opacity:.55}
.lane.lk-other::after{content:attr(data-lkn);position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 0 1px var(--lkc);
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.28) 0 7px,transparent 7px 14px);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;text-shadow:0 1px 2px #000}
.lane.lk-me::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px var(--lkc);z-index:3}
.lane.lk-other::after{display:flex;align-items:flex-end;justify-content:flex-end}
.strip[data-lk]>.nm{padding-right:16px}
/* ===== fenêtres pro ===== */
.pro-win{min-width:0}
.verb-win{background:linear-gradient(#2b2722,#1d1a17);border-color:#000}.verb-win .pt{background:linear-gradient(#4a3f33,#352d24)}
.tune-win{background:linear-gradient(#1f2a2e,#141b1e)}.tune-win .pt{background:linear-gradient(#2c3c42,#22303a)}
.pro{max-width:820px}
.pro-top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px}
.pro-top label{display:flex;flex-direction:column;font-size:10px;color:#b9a98f;gap:2px;text-transform:uppercase;letter-spacing:.5px}
.tune .pro-top label{color:#8fb9b0}
.pro-brand{font:700 20px Georgia,serif;letter-spacing:4px;color:#e8b04b;display:flex;flex-direction:column;line-height:1;margin-right:6px}
.pro-brand small{font:italic 10px Georgia,serif;letter-spacing:1px;color:#b9a98f}
.pro-brand.t{font:800 18px -apple-system,Helvetica,sans-serif;letter-spacing:2px;color:#e6f2ef;flex-direction:row;gap:4px}.pro-brand.t b{color:#5ee0c6}
.pro-sel{background:#120f0c;border:1px solid #5a4a38;border-radius:5px;padding:3px 6px}.pro-sel.big{font-size:13px;min-width:170px}
.tune .pro-sel{background:#0b1216;border-color:#2f4a50}
.seg{display:flex}.seg button{border-radius:0;padding:3px 8px}.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0}
.seg button.on{background:linear-gradient(#e8b04b,#b98325);color:#1b140c;border-color:#7a5516}
.pro-desc{font-size:11px;color:#c9b99e;margin:-2px 0 8px;font-style:italic}
.pro-groups{display:flex;flex-wrap:wrap;gap:8px}
.pro-g{background:rgba(0,0,0,.25);border:1px solid rgba(232,176,75,.18);border-radius:8px;padding:4px 8px 6px}
.pro-g h5{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:#e8b04b;margin:2px 0 2px}
.pro-row{display:flex;gap:2px;align-items:flex-end}
.pro .knob .kl{color:#d8cbb5}.tune .knob .kl{color:#a9cfc7}
.pro-foot{font-size:10px;color:#8c806d;margin-top:8px;text-align:center}.tune .pro-foot{color:#6e8b86}
.tune-mid{display:flex;gap:8px;align-items:stretch}
.tune-side{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:flex-start}
.tune-center{display:flex;flex-direction:column;gap:6px}
.tune-graph{border-radius:8px;border:1px solid #23383d;display:block}
.notes-ed{display:flex;gap:3px}
.notes-ed .nt{flex:1;display:flex;flex-direction:column;align-items:center;padding:3px 0;border-radius:5px;background:#e9efee;color:#102024;border:1px solid #000;min-width:0}
.notes-ed .nt.blk{background:#1d2a2e;color:#cfe}
.notes-ed .nt b{font-size:10px}.notes-ed .nt i{font-style:normal;font-size:11px;font-weight:700}
.notes-ed .nt.on i{color:#12a88d}.notes-ed .nt.byp i{color:#d29b00}.notes-ed .nt.off{opacity:.35}
.tog{min-width:110px}.tog.on{background:linear-gradient(#2fbfa3,#1d8f7a);color:#04211b}
.legend{display:flex;gap:14px;font-size:10px;justify-content:center}
.tune-bottom{display:flex;gap:18px;align-items:flex-end;justify-content:center;margin-top:8px;padding-top:8px;border-top:1px solid #23383d}

<script type="text/worklet" id="worklet-src">// ===== AudioWorklet processors (chargés via Blob URL) =====
class RecProcessor extends AudioWorkletProcessor{
  constructor(){super();this.on=false;this.port.onmessage=e=>{this.on=e.data.rec};this.n=0;this.peak=0}
  process(inputs){
    const ch=inputs[0]&&inputs[0][0];
    if(ch){
      let p=0;for(let i=0;i<ch.length;i++){const a=Math.abs(ch[i]);if(a>p)p=a}
      this.peak=Math.max(p,this.peak*0.9);
      if(this.on)this.port.postMessage({t:currentFrame,d:ch.slice(0)});
      if(++this.n%8===0)this.port.postMessage({peak:this.peak});
    }
    return true;
  }
}
registerProcessor('rec-proc',RecProcessor);

// Correcteur de pitch (effet "autotune") : détection YIN + pitch shifter granulaire
class PitchProc extends AudioWorkletProcessor{
  static get parameterDescriptors(){return[
    {name:'amount',defaultValue:1,minValue:0,maxValue:1},
    {name:'speed',defaultValue:0.01,minValue:0,maxValue:0.5},
    {name:'mix',defaultValue:1,minValue:0,maxValue:1},
    {name:'shift',defaultValue:0,minValue:-12,maxValue:12}]}
  constructor(o){
    super();const po=(o&&o.processorOptions)||{};
    this.scale=po.scale||[0,2,3,5,7,8,10];this.key=po.key|0;
    this.port.onmessage=e=>{if(e.data.scale)this.scale=e.data.scale;if(e.data.key!==undefined)this.key=e.data.key};
    this.N=8192;this.W=Math.round(sampleRate*0.024);
    this.bufs=[new Float32Array(this.N),new Float32Array(this.N)];
    this.w=0;this.rp=600;this.rpOld=600;this.xf=0;this.xfN=1;this.P=Math.round(sampleRate/200);this.ratio=1;this.target=1;
    this.det=new Float32Array(1024);this.dw=0;this.dcount=0;this.dec=0;this.decN=0;
    this.hop=256;this.since=0;this.lastNote=-1;
    this.minLag=Math.floor(sampleRate/2/900);this.maxLag=Math.floor(sampleRate/2/70);
    this.win=600;this.d=new Float32Array(this.maxLag+2);this.frame=new Float32Array(this.win+this.maxLag+2);
  }
  detect(){
    const L=this.det.length,need=this.win+this.maxLag+1,f=this.frame;
    for(let i=0;i<need;i++)f[i]=this.det[(this.dw-need+i+L*4)%L];
    let rms=0;for(let i=0;i<this.win;i++)rms+=f[i]*f[i];rms=Math.sqrt(rms/this.win);
    if(rms<0.008)return 0;
    const d=this.d;d[0]=1;let run=0,best=-1;
    for(let tau=1;tau<=this.maxLag;tau++){
      let s=0;for(let i=0;i<this.win;i+=2){const x=f[i]-f[i+tau];s+=x*x}
      run+=s;d[tau]=run>0?s*tau/run:1;
    }
    for(let tau=this.minLag;tau<this.maxLag;tau++){
      if(d[tau]<0.18){while(tau+1<this.maxLag&&d[tau+1]<d[tau])tau++;best=tau;break}
    }
    if(best<0)return 0;
    const a=d[best-1],b=d[best],c=d[best+1];const den=a-2*b+c;
    const t=den!==0?best+0.5*(a-c)/den:best;
    return (sampleRate/2)/t;
  }
  process(inputs,outputs,P){
    const inp=inputs[0],out=outputs[0];if(!out||!out[0])return true;
    const n=out[0].length,chs=out.length;
    const amount=P.amount[0],speed=P.speed[0],mix=P.mix[0],shift=P.shift[0];
    const src0=inp&&inp[0]?inp[0]:null;
    for(let i=0;i<n;i++){
      const x0=src0?src0[i]:0;
      // décimation x2 pour la détection
      this.dec+=x0;if(++this.decN===2){this.det[this.dw]=this.dec*0.5;this.dw=(this.dw+1)%this.det.length;this.dec=0;this.decN=0}
      if(++this.since>=this.hop){
        this.since=0;const f=this.detect();let tgt=Math.pow(2,shift/12);
        if(f>0){
          this.P=this.P*0.5+(sampleRate/f)*0.5;
          const m=69+12*Math.log2(f/440);
          let bestN=m,bd=99;
          for(let o=-1;o<=10;o++)for(const s of this.scale){const nn=o*12+this.key+s;const dd=Math.abs(nn-m);if(dd<bd){bd=dd;bestN=nn}}
          if(this.lastNote>=0&&Math.abs(bestN-this.lastNote)===1&&Math.abs(m-this.lastNote)<0.65)bestN=this.lastNote;
          this.lastNote=bestN;
          tgt*=Math.pow(2,(bestN-m)*amount/12);
        }
        this.target=tgt;
      }
      const k=speed<=0.0005?1:1-Math.exp(-1/(speed*sampleRate));
      this.ratio+=(this.target-this.ratio)*k;
      // lecture à vitesse "ratio" avec sauts d'une période entière + fondu (PSOLA simplifié)
      const Pd=this.P,X=Math.min(256,Pd|0),minD=8+X,maxD=minD+Math.max(3*Pd,700);
      this.rp+=1-this.ratio;if(this.xf>0)this.rpOld+=1-this.ratio;
      if(this.xf<=0){
        if(this.rp<minD){this.rpOld=this.rp;this.rp+=Math.ceil((minD+Pd-this.rp)/Pd)*Pd;this.xf=this.xfN=X}
        else if(this.rp>maxD){this.rpOld=this.rp;this.rp-=Math.ceil((this.rp-(maxD-Pd))/Pd)*Pd;if(this.rp<minD)this.rp+=Pd;this.xf=this.xfN=X}
      }
      const fo=this.xf>0?this.xf/this.xfN:0;if(this.xf>0)this.xf--;
      for(let c=0;c<chs;c++){
        const b=this.bufs[c<2?c:1];const x=inp&&inp[c]?inp[c][i]:x0;b[this.w]=x;
        const rd=dd=>{let r=this.w-dd;if(r<0)r+=this.N;const i1=r|0,f1=r-i1;return b[i1]+(b[(i1+1)%this.N]-b[i1])*f1};
        let y=rd(this.rp);if(fo>0)y=y*(1-fo)+rd(this.rpOld)*fo;
        out[c][i]=x*(1-mix)+y*mix;
      }
      this.w=(this.w+1)%this.N;
    }
    return true;
  }
}
registerProcessor('pitch-proc',PitchProc);

class GateProc extends AudioWorkletProcessor{
  static get parameterDescriptors(){return[{name:'thr',defaultValue:-50},{name:'rel',defaultValue:0.12}]}
  constructor(){super();this.env=0;this.g=0;this.hold=0}
  process(inputs,outputs,P){
    const inp=inputs[0],out=outputs[0];if(!out[0])return true;
    const thr=Math.pow(10,P.thr[0]/20),rel=P.rel[0],n=out[0].length;
    const att=1-Math.exp(-1/(0.002*sampleRate)),rl=1-Math.exp(-1/(Math.max(0.01,rel)*sampleRate));
    for(let i=0;i<n;i++){
      let a=0;for(let c=0;c<inp.length;c++)a=Math.max(a,Math.abs(inp[c][i]));
      this.env=Math.max(a,this.env*0.9995);
      if(this.env>thr)this.hold=Math.floor(0.03*sampleRate);
      const open=this.hold-->0?1:0;
      this.g+=(open-this.g)*(open?att:rl);
      for(let c=0;c<out.length;c++)out[c][i]=(inp[c]?inp[c][i]:0)*this.g;
    }
    return true;
  }
}
registerProcessor('gate-proc',GateProc);

class CrushProc extends AudioWorkletProcessor{
  static get parameterDescriptors(){return[{name:'bits',defaultValue:8,minValue:1,maxValue:16},{name:'down',defaultValue:4,minValue:1,maxValue:64},{name:'mix',defaultValue:1,minValue:0,maxValue:1}]}
  constructor(){super();this.h=[0,0];this.c=0}
  process(inputs,outputs,P){const inp=inputs[0],out=outputs[0];if(!out[0])return true;
    const q=Math.pow(2,P.bits[0]-1),dn=Math.max(1,Math.round(P.down[0])),mix=P.mix[0],n=out[0].length;
    for(let i=0;i<n;i++){if(this.c<=0){for(let c=0;c<out.length;c++){const x=inp[c]?inp[c][i]:(inp[0]?inp[0][i]:0);this.h[c&1]=Math.round(x*q)/q}this.c=dn}this.c--;
      for(let c=0;c<out.length;c++){const x=inp[c]?inp[c][i]:(inp[0]?inp[0][i]:0);out[c][i]=x*(1-mix)+this.h[c&1]*mix}}
    return true}
}
registerProcessor('crush-proc',CrushProc);

// Limiteur transparent à anticipation (lookahead)
class LimitProc extends AudioWorkletProcessor{
  static get parameterDescriptors(){return[{name:'gain',defaultValue:1},{name:'ceil',defaultValue:.89},{name:'rel',defaultValue:.08}]}
  constructor(){super();this.L=Math.max(8,Math.round(sampleRate*.004));this.N=this.L+1;this.buf=[new Float32Array(this.N),new Float32Array(this.N)];this.tq=new Float32Array(this.N);
    this.qi=new Int32Array(this.N*2);this.qv=new Float32Array(this.N*2);this.qh=0;this.qt=0;this.n=0;this.w=0;this.g=1;this.gr=0;this.k=0}
  process(inputs,outputs,P){const inp=inputs[0],out=outputs[0];if(!out[0])return true;
    const G=P.gain[0],C=P.ceil[0],rel=1-Math.exp(-1/(Math.max(.01,P.rel[0])*sampleRate)),att=1-Math.exp(-1/(this.L/4)),n=out[0].length,Q=this.N*2;
    for(let i=0;i<n;i++){let pk=0;
      for(let c=0;c<2;c++){const x=(inp[c]?inp[c][i]:(inp[0]?inp[0][i]:0))*G;this.buf[c][this.w]=x;const a=Math.abs(x);if(a>pk)pk=a}
      const tg=pk>C?C/pk:1,idx=this.n++;
      while(this.qt>this.qh&&this.qv[(this.qt-1)%Q]>=tg)this.qt--;this.qi[this.qt%Q]=idx;this.qv[this.qt%Q]=tg;this.qt++;
      while(this.qi[this.qh%Q]<=idx-this.L-1)this.qh++;
      const need=this.qv[this.qh%Q];
      this.g=need<this.g?this.g+(need-this.g)*att:this.g+(need-this.g)*rel;if(this.g>need&&need<this.g*0.5)this.g=need;
      const r=(this.w+1)%this.N;
      for(let c=0;c<out.length;c++){let y=this.buf[c&1][r]*this.g;if(y>C)y=C;else if(y<-C)y=-C;out[c][i]=y}
      this.w=r;this.gr=Math.min(this.gr,this.g)}
    if(++this.k%16===0){this.port.postMessage(this.gr);this.gr=1}
    return true}
}

    if(opt.key)KNOBS[opt.key]=()=>{const c=get();sel.selectedIndex=typeof c==='number'?c:d.opts.indexOf(c)};
    return h('div',{class:'knob',style:{width:(opt.w||80)+'px'}},sel,h('div',{class:'kl'},d.n))}
  const S=opt.size||38,cv=h('canvas',{width:S*2,height:S*2,style:{width:S+'px',height:S+'px'}}),val=h('div',{class:'kv'}),
    w=h('div',{class:'knob'+(opt.key&&P.midiMap&&Object.values(P.midiMap).includes(opt.key)?' mapped':''),style:opt.w?{width:opt.w+'px'}:null},cv,h('div',{class:'kl',title:d.n},d.n),val);

function targetSet(key,n){
  const [k,id,a,b]=key.split('|');const o=findObj(id);if(!o)return;
  if(k==='p'){const pl=o.plugins[+a];if(!pl||!PLUGINS[pl.type])return;const d=PLUGINS[pl.type].params.find(x=>x.id===b);pl.params[b]=d.opts?Math.round(n*(d.opts.length-1)):fromN(n,d);E.updateStrip(o)}
  else if(k==='i'){const d=o.type==='synth'?SYNTH_PARAMS.find(x=>x.id===a):null;if(d){if(d.opts){const ix=Math.round(n*(d.opts.length-1));o.instr[a]=a==='mono'?ix:d.opts[ix]}else o.instr[a]=fromN(n,d)}}
  else if(k==='v'){o.vol=n<.01?-60:-60+66*Math.pow(n,.5);E.updateStrip(o);syncFaders(id)}
  else if(k==='pan'){o.pan=n*2-1;E.updateStrip(o)}
  else if(k==='snd'){o.sends[+a]=n<.01?-60:-60+66*n;E.updateStrip(o)}
  if(KNOBS[key])KNOBS[key]();DIRTY=true;
}

async function initMIDI(verbose){
  if(!navigator.requestMIDIAccess){if(verbose)toast('Ce navigateur ne gère pas le MIDI (utilisez Chrome ou Edge)');return}
  try{MIDI=await navigator.requestMIDIAccess();const hook=()=>{MIDI.inputs.forEach(i=>i.onmidimessage=onMidi)};hook();MIDI.onstatechange=hook;
    if(verbose)toast(MIDI.inputs.size?'MIDI prêt : '+[...MIDI.inputs.values()].map(i=>i.name).join(', '):'Aucun appareil MIDI détecté')}catch(e){if(verbose)toast('MIDI refusé')}
}
function onMidi(m){
  const [st,d1,d2]=m.data,cmd=st&0xf0,ch=st&15;
  if(cmd===0xB0){const id='cc:'+ch+':'+d1;
    if(LEARN){for(const k in P.midiMap)if(P.midiMap[k]===LEARN.key)delete P.midiMap[k];P.midiMap[id]=LEARN.key;LEARN.w.classList.remove('learn');LEARN.w.classList.add('mapped');toast('Assigné au CC '+d1);LEARN=null;return}
    const key=P.midiMap[id];if(key)targetSet(key,d2/127);return}
  const t=findTrack(SEL);if(!t||t.type==='audio')return;
  if(cmd===0x90&&d2>0)E.noteOn(t,d1,d2/127);else if(cmd===0x80||(cmd===0x90&&d2===0))E.noteOff(t,d1);
}

  items=items.filter(([t,r])=>r.start<x-1e-6&&r.start+rLen(t,r)>x+1e-6);if(!items.length)return toast('Placez la tête de lecture sur une région');snapshot();
  for(const [t,r] of items){const d=x-r.start,c=deep(r);c.id=uid('r');c.start=x;

function carve(t,a,b){ // efface la zone [a,b) des régions audio existantes (ré-enregistrement)
  const out=[],sp=spb();for(const r of t.regions){const s=r.start,e=s+r.dur/sp;if(e<=a||s>=b){out.push(r);continue}
    if(s<a){const c=deep(r);c.dur=(a-s)*sp;out.push(c)}if(e>b){const c=deep(r);c.id=uid('r');c.start=b;c.offset=r.offset+(b-s)*sp;c.dur=(e-b)*sp;out.push(c)}}t.regions=out}

const PLUGIN_TEMPLATE=`// Modèle de plugin externe pour Studio
// 1) Copiez ce fichier, changez id/name/params et le traitement dans create()
// 2) Dans l'appli : slot "+ effet" → "Charger un plugin externe (.js)"
// create(ctx) doit renvoyer { input, output, set(params), dispose() } avec des nœuds Web Audio.

registerPlugin({
  id: 'tremolo',
  name: 'Trémolo (exemple)',
  params: [
    { id: 'rate',  n: 'Vitesse',    min: 0.5, max: 20,  def: 5,  u: 'Hz', log: 1 },
    { id: 'depth', n: 'Profondeur', min: 0,   max: 100, def: 60, u: '%' },
    { id: 'shape', n: 'Forme', opts: ['Sinus', 'Carré', 'Triangle'], def: 0 }

  create(ctx) {
    const amp = ctx.createGain(), lfo = ctx.createOscillator(), depth = ctx.createGain();

      input: amp, output: amp,

        lfo.frequency.value = p.rate;
        depth.gain.value = p.depth / 200;
        amp.gain.value = 1 - p.depth / 200;

      dispose() { lfo.stop(); }
    };
  }
});

(function(){let lp=null,lastCtx=0;

    lp={x,y,t:setTimeout(()=>{lp=null;if(Date.now()-lastCtx<900)return;const el=document.elementFromPoint(x,y);if(!el)return;if(navigator.vibrate)navigator.vibrate(12);
      el.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:x,clientY:y}))},550)}},true);
  document.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){clearTimeout(lp.t);lp=null}},true);

<h4>Pistes</h4><p><kbd>↑</kbd><kbd>↓</kbd> piste précédente/suivante · <kbd>Suppr</kbd> supprimer la piste (si aucune région sélectionnée) · <kbd>Ctrl+Suppr</kbd> supprimer la piste · <kbd>Maj+D</kbd> dupliquer la piste · <kbd>M</kbd> muet · <kbd>S</kbd> solo · <kbd>Ctrl+Alt+A</kbd> nouvelle piste voix · <kbd>Ctrl+Alt+S</kbd> nouvel instrument · <kbd>Ctrl+Alt+D</kbd> nouvelle batterie</p>

  for(const k in n){const a=o[k],b=n[k];if(deepEq(a,b))continue;const cur=ym.get(k);
    if(isObj(a)&&isObj(b)&&cur instanceof Y.Map)yObj(cur,a,b);
    else if(Array.isArray(a)&&Array.isArray(b)&&cur instanceof Y.Array)yArr(cur,a,b);
    else ym.set(k,toY(b))}}
function yArr(ya,o,n){
  if(idArr(o)&&idArr(n)){ // pistes, régions… : réconciliation par identifiant
    const keep=new Set(n.map(e=>e.id)),cur=o.slice();
    for(let i=cur.length-1;i>=0;i--)if(!keep.has(cur[i].id)){ya.delete(i,1);cur.splice(i,1)}
    for(let i=0;i<n.length;i++){const e=n[i];
      if(cur[i]&&cur[i].id===e.id){if(!deepEq(cur[i],e))yObj(ya.get(i),cur[i],e);continue}
      const j=cur.findIndex((x,k)=>k>i&&x.id===e.id);if(j>=0){ya.delete(j,1);cur.splice(j,1)}
      ya.insert(i,[toY(e)]);cur.splice(i,0,e)}
    return}
  let s=0;while(s<o.length&&s<n.length&&deepEq(o[s],n[s]))s++;
  let e=0;while(e<o.length-s&&e<n.length-s&&deepEq(o[o.length-1-e],n[n.length-1-e]))e++;
  const om=o.length-s-e,nm=n.slice(s,n.length-e);
  if(om===nm.length){for(let i=0;i<om;i++){const a=o[s+i],b=nm[i],cur=ya.get(s+i);
      if(isObj(a)&&isObj(b)&&cur instanceof Y.Map)yObj(cur,a,b);else if(Array.isArray(a)&&Array.isArray(b)&&cur instanceof Y.Array)yArr(cur,a,b);
      else{ya.delete(s+i,1);ya.insert(s+i,[toY(b)])}}return}
  if(om)ya.delete(s,om);if(nm.length)ya.insert(s,nm.map(toY))}

    if(idArr(b)&&a.every(isObj)){const by=new Map(a.filter(x=>x.id).map(x=>[x.id,x]));out=b.map(e=>by.has(e.id)?patchObj(by.get(e.id),e):e)}
    else out=b.map((e,i)=>i<a.length?patchVal(a[i],e):e);

function collabFlush(){

  if(P!==COLLAB.pRef){collabStop();toast('Vous avez ouvert un autre projet : vous avez quitté la session',4500);return}

function xhrUpload(url,body,type,onProg){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',url);

  x.onload=()=>{const t=x.responseText||'';if(x.status>=200&&x.status<300||/duplicate|already exists|"409"/i.test(t))res();
    else rej(new Error(/too large|"413"|exceeded the maximum/i.test(t)?'fichier trop gros pour le serveur':'erreur '+x.status+' '+t.slice(0,120)))};
  x.onerror=()=>rej(new Error('connexion interrompue'));x.send(body)})}
async function fetchBytes(url,onProg,total){const r=await fetch(url);if(!r.ok)throw Object.assign(new Error('HTTP '+r.status),{status:r.status});
  const len=+r.headers.get('content-length')||total||0;if(!r.body||!r.body.getReader){const b=new Uint8Array(await r.arrayBuffer());onProg&&onProg(1);return b}

  const out=new Uint8Array(got);let o=0;for(const c of chunks){out.set(c,o);o+=c.length}return out}
async function uploadBufs(){
  if(!SUPA.url||!COLLAB.synced||COLLAB.viewer||NET.uploading||!P)return;const media=MEDIA(),t=Date.now();
  const ids=[...usedBufs(P)].filter(id=>id&&BUFS[id]&&!media.has(id)&&!(NET.upFail[id]&&t-NET.upFail[id]<60000));if(!ids.length)return;NET.uploading=true;
  try{for(const id of ids){if(!COLLAB.on||media.has(id))continue;
    if(NET.oldUp.has(id)){COLLAB.doc.transact(()=>media.set(id,{f:'wav',n:1}),'media');continue}
    const name=bufLabel(id),b=BUFS[id];
    try{xfer(id,'up',name,0,'compression');
      const data=await encodeFLAC(b,p=>xfer(id,'up',name,p*.25,'compression'));if(!COLLAB.on)break;
      const n=Math.ceil(data.length/PART);
      for(let i=0;i<n;i++)await xhrUpload(SUPA.url+'/storage/v1/object/sons/'+sonKey(id,'flac',i,n),data.subarray(i*PART,Math.min(data.length,(i+1)*PART)),'audio/flac',
        f=>xfer(id,'up',name,.25+.75*(i+f)/n,'envoi'));
      if(COLLAB.on)COLLAB.doc.transact(()=>media.set(id,{f:'flac',n,size:data.length,dur:+b.duration.toFixed(2)}),'media');xferDone(id)}
    catch(e){NET.upFail[id]=Date.now();console.warn('Session : envoi du son impossible',e);xferErr(id,'⚠ « '+name+' » n’a pas pu être envoyé ('+e.message+'). Nouvel essai dans 1 min.')}}}
  finally{NET.uploading=false}}
function fetchMissingBufs(){if(!COLLAB.on||!P)return;for(const id of usedBufs(P))if(id&&!BUFS[id]&&!NET.dl[id])NET.dl[id]=loadBuf(id).finally(()=>{delete NET.dl[id]})}
async function loadBuf(id){
  try{const b=await IDB.get('buffers',id);if(b&&!BUFS[id]){const ab=ctx.createBuffer(b.ch,b.len,b.sr);b.data.forEach((d,c)=>ab.copyToChannel(d,c));addBuffer(ab,id);SAVED_BUFS.add(id);bufsArrived();return}}catch(e){}
  if(BUFS[id]||!COLLAB.on)return;const m=MEDIA()&&MEDIA().get(id),t=Date.now();
  if(SUPA.url&&m){const name=bufLabel(id);
    try{const parts=[];for(let i=0;i<m.n;i++)parts.push(await fetchBytes(SUPA.url+'/storage/v1/object/public/sons/'+sonKey(id,m.f,i,m.n),f=>xfer(id,'down',name,(i+f)/m.n*.95,'réception'),m.size?m.size/m.n:0));
      let all=parts[0];if(parts.length>1){all=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let o=0;for(const p of parts){all.set(p,o);o+=p.length}}
      xfer(id,'down',name,.97,'décodage');const ab=await ctx.decodeAudioData(all.buffer.slice(all.byteOffset,all.byteOffset+all.length));
      if(!BUFS[id])addBuffer(ab,id);xferDone(id);bufsArrived()}
    catch(e){console.warn('Session : réception du son impossible',e);xferErr(id,'⚠ « '+name+' » n’a pas pu être reçu ('+e.message+'). Nouvel essai bientôt.');await new Promise(r=>setTimeout(r,8000))}
    return}
  if(NET.dlTry[id]&&t-NET.dlTry[id]<6000)return;NET.dlTry[id]=t;
  if(SUPA.url&&!m)try{const r=await fetch(SUPA.url+'/storage/v1/object/public/sons/'+id+'.wav');if(r.ok){const ab=await ctx.decodeAudioData(await r.arrayBuffer());if(!BUFS[id])addBuffer(ab,id);bufsArrived();return}}catch(e){}

function collabStart(room,host,opt){
  if(COLLAB.on)collabStop(true);
  if(typeof Y==='undefined')return toast('Ce navigateur ne permet pas les sessions à plusieurs');
  const viewer=!!(opt&&opt.viewer);if(viewer&&!SUPA.url)return toast('Le lien d’écoute a besoin d’internet');
  Object.assign(COLLAB,{on:true,synced:false,viewer,room,queue:[],peers:{},waiting:{},lockSeen:{},um:null,adopting:false,projDirty:false,lockDirty:false,docChanged:false,toldWait:0});
  const doc=COLLAB.doc=new Y.Doc(),ldoc=COLLAB.ldoc=new Y.Doc();COLLAB.root=doc.getMap('p');COLLAB.locks=ldoc.getMap('locks');
  doc.on('update',(u,origin)=>{COLLAB.docChanged=true;if(origin!=='remote'&&!viewer)send({k:'up',d:'p',u});
    if(isRelay()){NET.vupQ.push(u);if(!NET.upT)NET.upT=setTimeout(netFlushUp,90)}});
  ldoc.on('update',(u,origin)=>{if(origin!=='remote'&&!viewer)send({k:'up',d:'l',u})});
  COLLAB.root.observeDeep((ev,tr)=>{if(tr.origin==='remote')COLLAB.projDirty=true});
  COLLAB.locks.observe(ev=>{const t=Date.now();ev.keysChanged.forEach(k=>COLLAB.lockSeen[k]=t);
    if(ev.transaction.origin==='remote')COLLAB.lockDirty=true;else decorateLocks()});
  doc.getMap('media').observe(()=>{if(COLLAB.synced)fetchMissingBufs()});
  doc.getMap('meta').observe(()=>{if(!viewer&&COLLAB.synced)netSetV(doc.getMap('meta').get('listen'))});
  if(COLLAB_H.start)COLLAB_H.start(doc);
  COLLAB.ch=null;if(!viewer)try{if(window.BroadcastChannel){COLLAB.ch=new BroadcastChannel('studio-room-'+room);COLLAB.ch.onmessage=e=>onMsg(e.data,'')}}catch(e){}
  if(!COLLAB.ch&&!SUPA.url){COLLAB.on=false;return toast('Session impossible ici : ouvrez l’appli depuis son adresse en ligne')}
  try{history.replaceState(null,'',location.pathname+location.search+(viewer?'#ecoute=':'#room=')+room)}catch(e){}
  NET.topic='realtime:studio-'+(viewer?'v-':'')+room;NET.vtopic=null;NET.vjoined=false;NET.retry=0;NET.startT=Date.now();NET.dbMode=SUPA.url?'pending':'none';NET.upQ={p:[],l:[]};NET.vupQ=[];NET.parts={};NET.dlTry={};
  const T=(fn,ms)=>COLLAB.timers.push(setInterval(fn,ms));
  T(collabFlush,100);
  T(()=>{send({k:'pres'});const t=Date.now();let ch=false;for(const id in COLLAB.peers)if(t-COLLAB.peers[id].t>12000){const u=COLLAB.peers[id].user;delete COLLAB.peers[id];ch=true;if(COLLAB_H.left)COLLAB_H.left(u)}if(ch)renderPresence();
    fetchMissingBufs();uploadBufs();decorateLocks();if(COLLAB.synced)rememberRoom()},4000);

  if(viewer)T(()=>{if(COLLAB.synced)sendHello()},15000); // l'auditeur redemande ce qui lui manque (changement de relais)
  T(()=>{if(!COLLAB.synced||viewer)return;const m=myLocks();if(!m.length)return;const idle=Date.now()-LAST_INPUT>LOCK_IDLE;
    COLLAB.ldoc.transact(()=>m.forEach(([k,L])=>idle?COLLAB.locks.delete(k):COLLAB.locks.set(k,Object.assign({},L,{t:Date.now(),n:ME.name||L.n,c:ME.color}))),'lock');
    if(idle)toast('🔓 Vos cadenas ont été libérés (2 min sans activité)',4000)},20000);

  netConnect();renderPresence()}

  const title=h('input',{type:'text',value:P.name||'Mon morceau',maxlength:80,style:{width:'240px'},onkeydown:e=>e.stopPropagation()});
  const zone=h('select',null,h('option',{value:'all'},'Tout le morceau'),P.cycle.on&&h('option',{value:'cycle'},'La zone de cycle (boucle)'));
  const q=h('select',null,[[128,'128 kbit/s (léger)'],[192,'192 kbit/s (conseillé)'],[320,'320 kbit/s (meilleure qualité)']].map(([v,n])=>h('option',{value:v,selected:v===192},n)));
  const st=h('div',{style:{margin:'8px 0',minHeight:'18px'}}),bar=h('div',{class:'xb',style:{display:'none'}},h('i')),res=h('div');
  const go=h('button',{style:{padding:'8px 14px'},onclick:async()=>{go.disabled=true;bar.style.display='block';const set=(t,p)=>{st.textContent=t;bar.firstChild.style.width=Math.round(p*100)+'%'};
    try{if(E.playing)E.stop();let a=0,b=Math.max(...ends);if(zone.value==='cycle'){a=P.cycle.start;b=P.cycle.end}
      set('Rendu du mixage…',.05);const buf=await renderMix(P,a,b);
      const mp3=await encodeMP3(buf,+q.value,p=>set('Encodage MP3… '+Math.round(p*100)+' %',.1+p*.5));
      const f=newRoom(),key='bounces/'+f+'.mp3';
      await xhrUpload(SUPA.url+'/storage/v1/object/sons/'+key,mp3,'audio/mpeg',p=>set('Envoi… '+Math.round(p*100)+' %',.6+p*.4));
      set('Prêt ✔ ('+(mp3.size/1048576).toFixed(1)+' Mo, '+Math.round(buf.duration)+' s)',1);const link=bounceLink(f,title.value);
      res.append(linkRow('Lien d’écoute',link,'Écoute « '+title.value+' » 🎧'),h('p',{style:{color:'var(--dim)',fontSize:'11px'}},'Le lien s’ouvre sur n’importe quel téléphone ou ordinateur, sans l’appli. Toute personne qui a le lien peut écouter et télécharger le MP3.'));
      if(COLLAB.on&&COLLAB.synced&&!COLLAB.viewer)chatSend('📀 a partagé un bounce',{b:{f,title:title.value,dur:Math.round(buf.duration)}})}
    catch(e){console.warn(e);st.textContent='⚠ '+e.message;go.disabled=false}}},'📀 Créer le lien');
  modal([h('h2',null,'📀 Partager un lien d’écoute (MP3)'),h('p',{style:{color:'var(--dim)'}},'Le morceau est mixé, encodé en MP3 puis mis en ligne. Vous obtenez un lien à envoyer : on l’écoute sur téléphone sans ouvrir l’appli.'),
    h('div',{class:'kv2'},'Titre',title),h('div',{class:'kv2'},'Partie',zone),h('div',{class:'kv2'},'Qualité',q),st,bar,go,res])}

// ---------- panneau (chat · commentaires · versions) ----------
function openPanel(tab){C2.open=true;if(tab)C2.tab=tab;if(C2.tab==='chat'){C2.unread=0;renderBadge()}if(C2.tab==='vers'&&C2.vers==null)versionsLoad();drawPanel()}
function closePanel(){C2.open=false;const p=$('#cpanel');if(p)p.remove();C2.hi=null;renderPins()}
function renderBadge(){const b=$('#collabBar .chatb');if(!b)return;const n=C2.unread;b.dataset.n=n>99?'99+':n||'';b.classList.toggle('has',n>0)}
function drawPanel(){
  if(!C2.open||!COLLAB.on){const p=$('#cpanel');if(p)p.remove();return}
  let p=$('#cpanel');const keepScroll=p&&p.querySelector('.cbody')&&C2.tab!=='chat'?p.querySelector('.cbody').scrollTop:null;
  const draft=p&&p.querySelector('.cin input')?p.querySelector('.cin input').value:'';
  if(!p){p=h('div',{id:'cpanel'});document.body.append(p)}p.innerHTML='';
  const tabs=[['chat','💬 Chat'],['cmts','📌 Commentaires'],!COLLAB.viewer&&['vers','🕘 Versions']].filter(Boolean);
  p.append(h('div',{class:'ctabs'},tabs.map(([k,n])=>h('button',{class:C2.tab===k?'on':'',onclick:()=>openPanel(k)},n+(k==='cmts'?' ('+cmtList().filter(c=>!c.done).length+')':''))),h('div',{style:{flex:1}}),h('button',{title:'Fermer',onclick:closePanel},'✕')));
  const body=h('div',{class:'cbody'});p.append(body);
  if(!COLLAB.synced){body.append(h('p',{class:'dim'},'Connexion à la session…'));return}
  if(C2.tab==='chat'){
    const a=CHAT().toArray();if(!a.length)body.append(h('p',{class:'dim'},'Aucun message. Dites bonjour 👋'));
    for(const m of a){const mine=m.u===ME.id;body.append(h('div',{class:'cmsg'+(mine?' me':'')},h('div',{class:'cmeta'},h('b',{style:{color:m.c}},m.n),' ',h('span',null,hhmm(m.t))),
      m.b?h('div',{class:'ctxt'},m.x+' : ',h('a',{href:bounceLink(m.b.f,m.b.title),target:'_blank',rel:'noopener'},'📀 '+m.b.title+' ('+Math.floor(m.b.dur/60)+':'+String(m.b.dur%60).padStart(2,'0')+')')):h('div',{class:'ctxt'},m.x)))}
    const inp=h('input',{type:'text',placeholder:'Écrire un message…',maxlength:1000,value:draft,onkeydown:e=>{e.stopPropagation();if(e.key==='Enter'){chatSend(inp.value);inp.value=''}}});
    p.append(h('div',{class:'cquick'},['🔥','👍','😂','🎧','💯','🙏'].map(x=>h('button',{onclick:()=>chatSend(x)},x))),h('div',{class:'cin'},inp,h('button',{onclick:()=>{chatSend(inp.value);inp.value='';inp.focus()}},'➤')));
    setTimeout(()=>{body.scrollTop=body.scrollHeight},0);if(!IS_TOUCH)setTimeout(()=>inp.focus(),0)}
  else if(C2.tab==='cmts'){
    const at=C2.newAt!=null?C2.newAt:(E.playing?E.pos():PH);
    const ta=h('textarea',{class:'newc',rows:2,placeholder:'Ex : refais ce couplet ici, drop trop tôt…',onkeydown:e=>{e.stopPropagation();if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add()}}});
    const add=()=>{const x=ta.value.trim();if(!x)return;cmtAdd(Math.max(0,at),x);C2.newAt=null;ta.value='';toast('📌 Commentaire ajouté '+fmtBar(at))};
    body.append(h('div',{class:'cnew'},h('div',{class:'dim'},'📌 Nouveau commentaire '+fmtBar(at)+(C2.newAt==null?' (tête de lecture)':'')),ta,h('div',{style:{display:'flex',gap:'6px'}},h('button',{onclick:add},'Ajouter'),
      C2.newAt!=null&&h('button',{onclick:()=>{C2.newAt=null;drawPanel()}},'Annuler'))),
      h('label',{class:'dim',style:{display:'flex',gap:'6px',alignItems:'center',margin:'6px 0'}},h('input',{type:'checkbox',checked:C2.showDone,onchange:e=>{C2.showDone=e.target.checked;drawPanel();renderPins()}}),'Afficher les commentaires résolus'),
      h('p',{class:'dim',style:{fontSize:'11px'}},'Astuce : clic droit (ou appui long) dans la règle pour commenter à un endroit précis.'));
    const list=cmtList().filter(c=>C2.showDone||!c.done);if(!list.length)body.append(h('p',{class:'dim'},'Aucun commentaire.'));
    for(const c of list){const rep=h('input',{type:'text',placeholder:'Répondre…',maxlength:1000,onkeydown:e=>{e.stopPropagation();if(e.key==='Enter'&&rep.value.trim()){cmtReply(c.id,rep.value.trim());rep.value=''}}});
      const canMod=!COLLAB.viewer;
      body.append(h('div',{class:'ccmt'+(c.done?' done':'')+(C2.hi===c.id?' hi':''),style:{'--cc':c.c}},
        h('div',{class:'cmeta'},h('a',{href:'#',onclick:e=>{e.preventDefault();C2.hi=c.id;setPH(c.beat);renderPins();drawPanel()}},'▶ '+fmtBar(c.beat)),' · ',h('b',{style:{color:c.c}},c.n),' ',h('span',null,hhmm(c.t))),
        h('div',{class:'ctxt'},c.x),(c.rep||[]).map(r=>h('div',{class:'crep'},h('b',{style:{color:r.c}},r.n),' ',r.x)),
        h('div',{class:'cact'},rep,canMod&&h('button',{title:c.done?'Rouvrir':'Marquer comme résolu',onclick:()=>cmtSet(c.id,'done',!c.done)},c.done?'↺':'✔'),
          canMod&&(c.u===ME.id)&&h('button',{title:'Supprimer',onclick:e=>{if(e.target.dataset.sure){cmtDel(c.id)}else{e.target.dataset.sure=1;e.target.textContent='Sûr ?'}}},'🗑'))))}
    if(keepScroll!=null)body.scrollTop=keepScroll;
    if(C2.hi){const el=body.querySelector('.ccmt.hi');if(el)setTimeout(()=>el.scrollIntoView({block:'nearest'}),0)}}
  else if(C2.tab==='vers'){
    const nom=h('input',{type:'text',placeholder:'Nom (ex : avant le mix)',maxlength:80,onkeydown:e=>{e.stopPropagation();if(e.key==='Enter')save()}});
    const save=async()=>{sv.disabled=true;await versionSave(nom.value);nom.value='';sv.disabled=false};const sv=h('button',{onclick:save},'💾 Sauvegarder');
    body.append(h('div',{class:'cnew'},h('div',{class:'dim'},'Une version garde l’état complet du projet à cet instant. On peut y revenir à tout moment (et annuler avec Ctrl+Z).'),h('div',{style:{display:'flex',gap:'6px',marginTop:'6px'}},nom,sv)));
    if(C2.vers==null)body.append(h('p',{class:'dim'},'Chargement…'));else if(C2.vers==='err')body.append(h('p',{class:'dim'},'⚠ Impossible de lire les versions (connexion ?)'),h('button',{onclick:versionsLoad},'Réessayer'));
    else if(!C2.vers.length)body.append(h('p',{class:'dim'},'Aucune version pour l’instant.'));
    else for(const v of C2.vers)body.append(h('div',{class:'ccmt'},h('div',{class:'cmeta'},h('b',null,v.nom)),h('div',{class:'dim'},new Date(v.cree).toLocaleString()+' · '+(v.auteur||'?')+' · '+Math.max(1,Math.round(v.taille/1024))+' Ko'),
      h('div',{class:'cact'},h('button',{onclick:e=>{if(e.target.dataset.sure)versionRestore(v);else{e.target.dataset.sure=1;e.target.textContent='Revenir à cette version ? Confirmer'}}},'↩ Revenir à cette version'),
        h('button',{title:'Supprimer cette version',onclick:async e=>{if(!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent='Sûr ?';return}try{await rpc('version_del',{p_salle:COLLAB.room,p_id:v.id})}catch(err){toast('⚠ '+err.message)}versionsLoad()}},'🗑'))))}}

// ---------- branchements ----------
COLLAB_H.start=doc=>{C2.unread=0;C2.vers=null;C2.hi=null;C2.newAt=null;C2.clk={};
  doc.getArray('chat').observe(onChatChange);doc.getArray('cmts').observeDeep(onCmtChange)};
COLLAB_H.synced=()=>{renderPins();if(C2.open)drawPanel();COLLAB.timers.push(setInterval(()=>send({k:'ping',t0:Date.now()}),5000));setTimeout(()=>send({k:'ping',t0:Date.now()}),300)};
COLLAB_H.stop=()=>{closePanel();renderPins()};
COLLAB_H.joined=u=>{if(COLLAB.synced)toast('👋 '+(u.name||'Quelqu’un')+(u.role==='v'?' écoute la session (écoute seule)':' a rejoint la session'),2500);setTimeout(()=>send({k:'ping',t0:Date.now()}),200)};
COLLAB_H.left=u=>{delete C2.clk[u.id]};
COLLAB_H.bar=b=>{
  b.append(h('button',{class:'tbtn ens'+(C2.follow?' on':''),title:C2.follow?'🎧 Écouter ensemble : activé (▶ / ■ partagés). Cliquer pour écouter en solo.':'🎧 Écoute en solo. Cliquer pour écouter ensemble.',onclick:toggleFollow},'🎧'),
    h('button',{class:'tbtn chatb',title:'Chat, commentaires et versions',onclick:()=>C2.open?closePanel():openPanel()},'💬'));renderBadge()};
{const o=renderLanes;renderLanes=function(){const r=o.apply(this,arguments);if(COLLAB.on)renderPins();return r}}
document.addEventListener('contextmenu',e=>{if(!COLLAB.on||!COLLAB.synced||!e.target.closest||!e.target.closest('#ruler'))return;e.preventDefault();e.stopPropagation();
  const R=$('#ruler').getBoundingClientRect(),b=Math.max(0,snapB((e.clientX-R.left+$('#lanesWrap').scrollLeft)/PPB,1));
  menu(e,['Commentaire',['📌 Commenter ici ('+fmtBar(b)+')',()=>askComment(b)],['💬 Ouvrir le chat',()=>openPanel('chat')]])},true);
</script>
