<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2c2c2f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Studio">
<!--PWA--><title>
Studio</title><style>/*CSS*/</style></head><body>
<div id="app">
 <div id="bar">
  <div class="grp">
   <button id="bFile" title="Fichier : projets, import, export">☰ Fichier</button>
   <button id="bInsp" class="tbtn" title="Inspecteur (I)">ⓘ</button>
  </div>
  <div class="sp"></div>
  <div class="grp">
   <button id="bStart" class="tbtn" title="Aller au début (Entrée)">⏮</button>
   <button id="bStop" class="tbtn" title="Stop">■</button>
   <button id="bPlay" class="tbtn" title="Lecture / Stop (Espace)">▶</button>
   <button id="bRec" class="tbtn" title="Enregistrer (R)" style="color:#ff453a">●</button>
   <button id="bCycle" class="tbtn" title="Cycle / boucle (C)">🔁</button>
  </div>
  <div id="lcd">
   <div class="cell"><span class="v" id="lcdPos">  1 1 1</span><span class="l">Mesure · temps</span></div>
   <div class="cell tm"><span class="v" id="lcdTime">00:00.0</span><span class="l">Temps</span></div>
   <div class="cell"><input id="bpm" type="number" min="40" max="250"><span class="l">BPM</span></div>
   <div class="cell sg"><select id="sigSel"><option value="3">3/4</option><option value="4">4/4</option><option value="6">6/8</option></select><span class="l">Mesure</span></div>
   <div class="cell"><span><select id="keySel"></select><select id="scaleSel"></select></span><span class="l">Tonalité</span></div>
  </div>
  <div class="grp">
   <button id="bMetro" class="tbtn" title="Métronome (K)">♩</button>
   <button id="bCount" class="tbtn" title="Décompte avant enregistrement" style="font-size:10px">1234</button>
  </div>
  <div class="sp"></div>
  <div class="grp">
   <button id="bTyping" class="tbtn" title="Clavier musical : jouer avec le clavier de l’ordi (Ctrl+K)">⌨</button>
   <button id="bMidi" class="tbtn" title="Activer un clavier / contrôleur MIDI">🎛</button>
   <button data-tab="mixer" class="tbtn" title="Mixeur (X)" onclick="setTab('mixer')"><svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="1.5" x2="3" y2="14.5"/><line x1="9" y1="1.5" x2="9" y2="14.5"/><line x1="15" y1="1.5" x2="15" y2="14.5"/><rect x="0.8" y="8.5" width="4.4" height="3" rx="1" fill="currentColor"/><rect x="6.8" y="3.5" width="4.4" height="3" rx="1" fill="currentColor"/><rect x="12.8" y="10" width="4.4" height="3" rx="1" fill="currentColor"/></svg></button>
   <button data-tab="piano" class="tbtn" title="Piano Roll (P)" onclick="setTab('piano')">🎹</button>
   <button data-tab="steps" class="tbtn" title="Step Sequencer (E)" onclick="setTab('steps')">🥁</button>
   <button id="saveState" class="tbtn" title="Sauvegarde"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v8.5M4.5 6.8 8 10.3l3.5-3.5"/><path d="M2 11v2.5h12V11"/></svg></button>
   <button id="bLib" class="tbtn" title="Bibliothèque de plugins (Y)" onclick="toggleLibrary()" style="position:relative">🔌<i style="position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%"></i></button>
   <button id="bSettings" class="tbtn" title="Réglages">⚙</button>
   <button id="bHelp" class="tbtn" title="Aide">?</button>
  </div>
 </div>
 <div id="main">
  <div id="insp"></div>
  <div id="arr">
   <div id="arrtop">
    <div id="arrtools"><button id="bAdd" title="Ajouter une piste">+ Piste</button>
     <select id="snapSel" title="Magnétisme de la grille"><option value="4">Mesure</option><option value="1">1/4</option><option value="0.5">1/8</option><option value="0.25">1/16</option><option value="0.125">1/32</option><option value="0">Libre</option></select>
     <button id="bSplit" title="Couper la région à la tête de lecture (Ctrl+T)">✂</button><span style="color:var(--dim);font-size:10px;margin-left:2px">↔</span><button id="zOut" title="Zoom arrière (Ctrl+←)">−</button><button id="zIn" title="Zoom avant (Ctrl+→)">+</button><span style="color:var(--dim);font-size:10px">↕</span><button id="vOut" title="Pistes moins hautes (Ctrl+↓)">−</button><button id="vIn" title="Pistes plus hautes (Ctrl+↑)">+</button><button id="zFit" title="Tout voir (Z)">⤢</button></div>
    <div id="ruler"><canvas id="rulerCv"></canvas></div>
   </div>
   <div id="arrbody"><div id="heads"></div><div id="lanesWrap"><div id="lanes"></div></div></div>
  </div>
 </div>
 <div>
  <div id="resizer" title="Glisser pour redimensionner"></div>
  <div id="bottom"><div id="btabs"><button data-tab="mixer" style="display:inline-flex;gap:5px;align-items:center"><svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="1.5" x2="3" y2="14.5"/><line x1="9" y1="1.5" x2="9" y2="14.5"/><line x1="15" y1="1.5" x2="15" y2="14.5"/><rect x="0.8" y="8.5" width="4.4" height="3" rx="1" fill="currentColor"/><rect x="6.8" y="3.5" width="4.4" height="3" rx="1" fill="currentColor"/><rect x="12.8" y="10" width="4.4" height="3" rx="1" fill="currentColor"/></svg> Mixeur</button><button data-tab="piano">🎹 Piano Roll</button><button data-tab="steps">🥁 Step Sequencer</button><div class="sp"></div><button onclick="setTab(TAB)">✕</button></div><div id="bcontent"></div></div>
 </div>
</div>
<input type="file" id="fileAudio" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac" multiple hidden>
<input type="file" id="fileProj" hidden>
<input type="file" id="filePlug" accept=".js,text/javascript" hidden>
<div id="toast"></div><div id="drop">Déposez vos sons, un projet Logic (.logicx), des pistes exportées, un MIDI, un projet .studio ou un plugin .js</div>
<script type="text/worklet" id="worklet-src">/*WORKLET*/</script>
<script>/*JS*/</script>
</body></html>
